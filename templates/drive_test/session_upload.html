{% extends "base.html" %}

{% block title %}Upload Drive Test | UMP{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 720px;">
  <div class="d-flex align-items-center mb-4">
    <a href="{% url 'drive_test:dashboard' %}" class="btn btn-sm btn-outline-secondary me-3">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h1 class="h3 mb-0">Upload Drive Test</h1>
  </div>

  {% if errors %}
  <div class="alert alert-danger">
    <ul class="mb-0">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
  </div>
  {% endif %}

  <div class="card">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold">Operator <span class="text-danger">*</span></label>
          <select name="operator" class="form-select" required>
            <option value="">— Select operator —</option>
            {% for op in operators %}
            <option value="{{ op.id }}">{{ op.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Test Date <span class="text-danger">*</span></label>
            <input type="date" name="test_date" class="form-control" required
                   value="{{ request.POST.test_date }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Test Type</label>
            <select name="test_type" class="form-select">
              <option value="outdoor">Outdoor Drive Test</option>
              <option value="indoor">Indoor Walk Test</option>
              <option value="benchmarking">Benchmarking</option>
              <option value="regulatory">Regulatory Audit</option>
              <option value="coverage">Coverage Survey</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Title</label>
          <input type="text" name="title" class="form-control"
                 placeholder="e.g. Freetown North — Q3 Coverage Audit"
                 value="{{ request.POST.title }}">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Region</label>
          <select name="region" class="form-select">
            <option value="">— All / unspecified —</option>
            {% for r in regions %}
            <option value="{{ r.id }}">{{ r.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Drive Test File <span class="text-danger">*</span></label>
          <input type="file" name="drive_test_file" class="form-control" required
                 accept=".nemo,.rwd,.csv,.json,.xml,.bin,.log,.nmf">
          <div class="form-text">Supported: NEMO, TEMS, Spirent, CSV, JSON. Max 500 MB.</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-upload me-2"></i>Upload &amp; Queue Processing
          </button>
          <a href="{% url 'drive_test:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
