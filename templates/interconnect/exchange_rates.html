{% extends "base.html" %}
{% block title %}Exchange Rates — Interconnect{% endblock %}
{% block page_title %}Exchange Rates{% endblock %}

{% block content %}
<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-currency-exchange"></i> FX Rates</span>
        <span class="badge bg-secondary" id="totalBadge">{{ total }} rates</span>
    </div>
    <div class="card-body pb-2">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search currency / notes…" oninput="loadData()">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary btn-sm" onclick="openModal()"><i class="bi bi-plus-lg"></i> Add FX Rate</button>
            </div>
        </div>
    </div>
</div>

<div id="alertBox" class="alert" style="display:none;"></div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0">
                <thead class="table-light">
                    <tr>
                        <th>From</th><th>To</th><th class="text-end">Rate</th>
                        <th>Effective Date</th><th>Source</th><th>Notes</th><th width="80"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm"></div> Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center" id="pagBar" style="display:none !important;">
        <small class="text-muted">Showing <span id="pagShowing"></span> of <span id="pagTotal"></span></small>
        <nav><ul class="pagination pagination-sm mb-0" id="pagNums"></ul></nav>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Exchange Rate</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="entryId">
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">From <span class="text-danger">*</span></label>
                        <input type="text" id="fFrom" class="form-control form-control-sm" placeholder="USD" maxlength="3">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">To <span class="text-danger">*</span></label>
                        <input type="text" id="fTo" class="form-control form-control-sm" placeholder="SLE" maxlength="3">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">Rate <span class="text-danger">*</span></label>
                        <input type="number" step="0.00000001" id="fRate" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Effective Date <span class="text-danger">*</span></label>
                        <input type="date" id="fDate" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Source</label>
                        <select id="fSource" class="form-select form-select-sm">
                            {% for v,l in source_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">Notes</label>
                        <textarea id="fNotes" class="form-control form-control-sm" rows="2"></textarea>
                    </div>
                </div>
                <div id="modalError" class="alert alert-danger mt-2" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm" onclick="saveEntry()"><i class="bi bi-save"></i> Save</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
function getCSRF() { return document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''; }
function showAlert(msg, type='success') {
    const b=document.getElementById('alertBox'); b.className=`alert alert-${type}`; b.textContent=msg; b.style.display='block';
    setTimeout(()=>b.style.display='none',4000);
}
function today(){const d=new Date();return d.toISOString().slice(0,10);}

function loadData() {
    const q = document.getElementById('searchInput').value;
    fetch(`{% url 'interconnect:exchange_rate_api' %}?q=${encodeURIComponent(q)}&page=${currentPage}`)
        .then(r => r.json()).then(data => {
            document.getElementById('totalBadge').textContent = data.total + ' rates';
            const tbody = document.getElementById('tableBody');
            if (!data.records.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No FX rates found</td></tr>';
                document.getElementById('pagBar').style.cssText='display:none !important'; return;
            }
            tbody.innerHTML = data.records.map(r => `<tr>
                <td class="text-black"><strong>${r.from_currency}</strong></td>
                <td class="text-black"><strong>${r.to_currency}</strong></td>
                <td class="text-end text-black">${parseFloat(r.rate).toFixed(8)}</td>
                <td class="text-black">${r.effective_date}</td>
                <td class="text-black small">${r.source}</td>
                <td class="text-black small">${r.notes||'-'}</td>
                <td class="text-end">
                    <button class="btn btn-xs btn-outline-primary py-0 px-1 me-1" onclick='editEntry(${JSON.stringify(r).replace(/'/g,"\\'")})'><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-xs btn-outline-danger py-0 px-1" onclick="deleteEntry(${r.id})"><i class="bi bi-trash"></i></button>
                </td>
            </tr>`).join('');
            buildPagination(data.page, data.pages, data.total);
        });
}

function buildPagination(page, pages, total) {
    const bar = document.getElementById('pagBar');
    if (pages<=1){bar.style.cssText='display:none !important';return;}
    bar.style.cssText='display:flex !important';
    document.getElementById('pagShowing').textContent=`${(page-1)*25+1}–${Math.min(page*25,total)}`;
    document.getElementById('pagTotal').textContent=total;
    let html=`<li class="page-item ${page<=1?'disabled':''}"><a class="page-link" href="#" onclick="event.preventDefault();goPage(${page-1})">‹</a></li>`;
    for(let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++)
        html+=`<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" onclick="event.preventDefault();goPage(${i})">${i}</a></li>`;
    html+=`<li class="page-item ${page>=pages?'disabled':''}"><a class="page-link" href="#" onclick="event.preventDefault();goPage(${page+1})">›</a></li>`;
    document.getElementById('pagNums').innerHTML=html;
}
function goPage(p){currentPage=p;loadData();}

function openModal(r=null) {
    document.getElementById('entryId').value = r?.id||'';
    document.getElementById('fFrom').value = r?.from_currency||'';
    document.getElementById('fTo').value = r?.to_currency||'SLE';
    document.getElementById('fRate').value = r?.rate||'';
    document.getElementById('fDate').value = r?.effective_date||today();
    document.getElementById('fSource').value = r?.source||'MANUAL';
    document.getElementById('fNotes').value = r?.notes||'';
    document.getElementById('modalTitle').textContent = r?'Edit Exchange Rate':'Add Exchange Rate';
    document.getElementById('modalError').style.display='none';
    new bootstrap.Modal(document.getElementById('entryModal')).show();
}
function editEntry(r){openModal(r);}

function saveEntry() {
    const params = new URLSearchParams({
        csrfmiddlewaretoken:getCSRF(), id:document.getElementById('entryId').value,
        from_currency:document.getElementById('fFrom').value.trim(),
        to_currency:document.getElementById('fTo').value.trim(),
        rate:document.getElementById('fRate').value,
        effective_date:document.getElementById('fDate').value,
        source:document.getElementById('fSource').value,
        notes:document.getElementById('fNotes').value.trim(),
    });
    fetch("{% url 'interconnect:exchange_rate_save' %}", {method:'POST',body:params,headers:{'X-CSRFToken':getCSRF()}})
        .then(r=>r.json()).then(data=>{
            if(data.success){bootstrap.Modal.getInstance(document.getElementById('entryModal')).hide();showAlert('Saved.');loadData();}
            else{document.getElementById('modalError').textContent=data.error;document.getElementById('modalError').style.display='block';}
        });
}

function deleteEntry(id) {
    if(!confirm('Delete this FX rate?'))return;
    fetch(`{% url 'interconnect:exchange_rate_delete' 0 %}`.replace('/0/',`/${id}/`),{method:'POST',headers:{'X-CSRFToken':getCSRF()}})
        .then(r=>r.json()).then(d=>{if(d.success){showAlert('Deleted.');loadData();}else{showAlert(d.error||'Delete failed','danger');}});
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
