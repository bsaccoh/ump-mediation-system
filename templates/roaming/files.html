{% extends "base.html" %}
{% block title %}Roaming Files{% endblock %}
{% block page_title %}Roaming Files{% endblock %}

{% block content %}
<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-file-earmark-binary"></i> Roaming Files</span>
        <span class="badge bg-secondary" id="totalBadge">{{ total }} file{{ total|pluralize }}</span>
    </div>
    <div class="card-body pb-2">
        <div class="row g-2 align-items-end">
            <div class="col-md-5">
                <label class="form-label small mb-1">Billing Cycle</label>
                <select id="gCycle" class="form-select form-select-sm">
                    <option value="">— select cycle —</option>
                    {% for c in cycles %}<option value="{{ c.pk }}">{{ c.partner.code }} — {{ c.period_start }} → {{ c.period_end }} [{{ c.status }}]</option>{% endfor %}
                </select>
            </div>
            <div class="col-auto">
                <button class="btn btn-primary btn-sm" onclick="generateFile()"><i class="bi bi-play-fill"></i> Generate File</button>
            </div>
            <div class="col-auto">
                <select id="filterStatus" class="form-select form-select-sm" onchange="loadData()">
                    <option value="">All Statuses</option>
                    {% for v,l in status_choices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
                </select>
            </div>
        </div>
    </div>
</div>

<div id="alertBox" class="alert" style="display:none;"></div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0">
                <thead class="table-light">
                    <tr>
                        <th>File #</th><th>Partner</th><th>Cycle</th>
                        <th class="text-end">Records</th><th class="text-end">Voice min</th>
                        <th class="text-end">SMS</th><th class="text-end">Data MB</th>
                        <th class="text-end">Total</th><th>Status</th>
                        <th>SHA-256</th><th width="160"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="11" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm"></div> Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center" id="pagBar" style="display:none !important;">
        <small class="text-muted">Showing <span id="pagShowing"></span> of <span id="pagTotal"></span></small>
        <nav><ul class="pagination pagination-sm mb-0" id="pagNums"></ul></nav>
    </div>
</div>

<script>
let currentPage = 1;
const STATUS_COLORS = {DRAFT:'secondary',FINAL:'primary',SENT:'info',DISPUTED:'danger',SETTLED:'success'};
function getCSRF() { return document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''; }
function showAlert(msg, type='success') {
    const b=document.getElementById('alertBox'); b.className=`alert alert-${type}`; b.textContent=msg; b.style.display='block';
    setTimeout(()=>b.style.display='none',5000);
}
function fmt(n,dp=0){return parseFloat(n||0).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp});}

function loadData() {
    const status = document.getElementById('filterStatus').value;
    fetch(`{% url 'roaming:file_api' %}?status=${status}&page=${currentPage}`)
        .then(r=>r.json()).then(data=>{
            document.getElementById('totalBadge').textContent = data.total + ' file' + (data.total === 1 ? '' : 's');
            const tbody = document.getElementById('tableBody');
            if (!data.records.length) {
                tbody.innerHTML = '<tr><td colspan="11" class="text-center py-4 text-muted">No roaming files yet. Pick a cycle and click Generate.</td></tr>';
                document.getElementById('pagBar').style.cssText='display:none !important'; return;
            }
            tbody.innerHTML = data.records.map(r => {
                const c = STATUS_COLORS[r.status]||'secondary';
                return `<tr>
                    <td class="text-black"><a href="/roaming/files/${r.id}/" class="text-decoration-none"><strong>${r.file_number}</strong></a></td>
                    <td class="text-black"><strong>${r.partner}</strong> <small class="text-muted">${r.partner_name}</small></td>
                    <td class="text-black small">${r.cycle}</td>
                    <td class="text-end text-black">${fmt(r.record_count,0)}</td>
                    <td class="text-end text-black">${fmt(r.voice_minutes,2)}</td>
                    <td class="text-end text-black">${fmt(r.sms_count,0)}</td>
                    <td class="text-end text-black">${fmt(r.data_mb,2)}</td>
                    <td class="text-end text-black"><strong>${fmt(r.total_amount,2)}</strong> ${r.currency}</td>
                    <td><span class="badge bg-${c}">${r.status}</span></td>
                    <td class="text-black small"><code>${r.sha256||''}</code></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-xs btn-outline-secondary py-0 px-1" href="/roaming/files/${r.id}/csv/"><i class="bi bi-download"></i></a>
                        <a class="btn btn-xs btn-outline-primary py-0 px-1" href="/roaming/files/${r.id}/"><i class="bi bi-eye"></i></a>
                        <div class="dropdown d-inline-block">
                            <button class="btn btn-xs btn-outline-dark py-0 px-1 dropdown-toggle" data-bs-toggle="dropdown" title="Status"><i class="bi bi-check2-square"></i></button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item small" href="#" onclick="event.preventDefault();setStatus(${r.id},'FINAL')">Mark Final</a></li>
                                <li><a class="dropdown-item small" href="#" onclick="event.preventDefault();setStatus(${r.id},'SENT')">Mark Sent</a></li>
                                <li><a class="dropdown-item small" href="#" onclick="event.preventDefault();setStatus(${r.id},'SETTLED')">Mark Settled</a></li>
                                <li><a class="dropdown-item small" href="#" onclick="event.preventDefault();setStatus(${r.id},'DRAFT')">Revert to Draft</a></li>
                            </ul>
                        </div>
                        <button class="btn btn-xs btn-outline-danger py-0 px-1" onclick="deleteEntry(${r.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
            buildPagination(data.page, data.pages, data.total);
        });
}

function buildPagination(page, pages, total) {
    const bar = document.getElementById('pagBar');
    if (pages<=1){bar.style.cssText='display:none !important';return;}
    bar.style.cssText='display:flex !important';
    document.getElementById('pagShowing').textContent=`${(page-1)*25+1}–${Math.min(page*25,total)}`;
    document.getElementById('pagTotal').textContent=total;
    let html=`<li class="page-item ${page<=1?'disabled':''}"><a class="page-link" href="#" onclick="event.preventDefault();goPage(${page-1})">‹</a></li>`;
    for(let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++)
        html+=`<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" onclick="event.preventDefault();goPage(${i})">${i}</a></li>`;
    html+=`<li class="page-item ${page>=pages?'disabled':''}"><a class="page-link" href="#" onclick="event.preventDefault();goPage(${page+1})">›</a></li>`;
    document.getElementById('pagNums').innerHTML=html;
}
function goPage(p){currentPage=p;loadData();}

function generateFile() {
    const cycle = document.getElementById('gCycle').value;
    if(!cycle){showAlert('Pick a cycle first.','warning');return;}
    showAlert('Generating file…','info');
    const params = new URLSearchParams({csrfmiddlewaretoken:getCSRF(), cycle_id:cycle});
    fetch("{% url 'roaming:file_generate' %}", {method:'POST', body:params, headers:{'X-CSRFToken':getCSRF()}})
        .then(r=>r.json()).then(d=>{
            if(d.success){
                showAlert((d.message||'Roaming file generation queued.') + ' Redirecting…','info');
                if (d.job_url) setTimeout(()=>window.location=d.job_url, 600);
                else loadData();
            } else showAlert(d.error||'Generation failed','danger');
        });
}

function setStatus(id, status) {
    const params = new URLSearchParams({csrfmiddlewaretoken:getCSRF(), status:status});
    fetch(`/roaming/files/${id}/status/`, {method:'POST', body:params, headers:{'X-CSRFToken':getCSRF()}})
        .then(r=>r.json()).then(d=>{
            if(d.success){showAlert('Status: '+d.status);loadData();}
            else showAlert(d.error||'Update failed','danger');
        });
}

function deleteEntry(id) {
    if(!confirm('Delete this roaming file?'))return;
    fetch(`{% url 'roaming:file_delete' 0 %}`.replace('/0/',`/${id}/`),{method:'POST',headers:{'X-CSRFToken':getCSRF()}})
        .then(r=>r.json()).then(d=>{if(d.success){showAlert('Deleted.');loadData();}});
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
