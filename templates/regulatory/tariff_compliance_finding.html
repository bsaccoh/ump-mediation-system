{% extends "base.html" %}
{% block title %}Create Tariff Finding | NatCA{% endblock %}{% block page_title %}Create Finding{% endblock %}
{% block content %}<div class="container-fluid"><div class="row justify-content-center"><div class="col-lg-8"><div class="card"><div class="card-body"><h5 class="mb-1">Create Regulatory Finding</h5><p class="text-muted small mb-4">A new audit case will be created from this non-compliant tariff result.</p><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Operator</label><input class="form-control" value="{{ result.operator_code|capfirst }}" readonly></div><div class="col-md-6"><label class="form-label">Finding Type</label><input class="form-control" value="Tariff Non-Compliance" readonly></div><div class="col-md-6"><label class="form-label">Tariff</label><input class="form-control" value="{{ result.tariff_name }}" readonly></div><div class="col-md-6"><label class="form-label">Variance</label><input class="form-control" value="{{ result.variance_percent|floatformat:2 }}%" readonly></div><div class="col-md-6"><label class="form-label">Severity</label><select name="severity" class="form-select"><option value="LOW">Low</option><option value="MEDIUM" selected>Medium</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option></select></div><div class="col-md-6"><label class="form-label">Assigned Officer</label><select name="assigned_to" class="form-select"><option value="">Unassigned</option>{% for auditor in auditors %}<option value="{{ auditor.pk }}">{{ auditor.get_full_name|default:auditor.username }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="4" placeholder="Describe the tariff variance and required regulatory action."></textarea></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-danger"><i class="bi bi-flag"></i> Create Finding</button><a href="{% url 'regulatory:tariff_compliance_detail' result.pk %}" class="btn btn-outline-secondary">Cancel</a></div></form></div></div></div></div></div>{% endblock %}
