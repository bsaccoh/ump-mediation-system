{% extends "base.html" %}
{% block title %}NATCOM Reports — Regulatory{% endblock %}
{% block page_title %}NATCOM Reports{% endblock %}

{% block content %}
<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-file-earmark-bar-graph"></i> Generate Report</span>
        <span class="badge bg-secondary" id="totalBadge">{{ total }} reports</span>
    </div>
    <div class="card-body pb-2">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small mb-1">Report Type</label>
                <select id="gType" class="form-select form-select-sm">
                    {% for v,l in report_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1">Period Start</label>
                <input type="date" id="gStart" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1">Period End</label>
                <input type="date" id="gEnd" class="form-control form-control-sm">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary btn-sm" onclick="generateReport()"><i class="bi bi-play-fill"></i> Generate</button>
            </div>
            <div class="col-auto">
                <select id="filterType" class="form-select form-select-sm" onchange="loadData()">
                    <option value="">All Types</option>
                    {% for v,l in report_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}
                </select>
            </div>
        </div>
    </div>
</div>

<div id="alertBox" class="alert" style="display:none;"></div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover table-sm mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Type</th><th>Period</th><th>Status</th><th>Generated</th><th width="220"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm"></div> Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center" id="pagBar" style="display:none !important;">
        <small class="text-muted">Showing <span id="pagShowing"></span> of <span id="pagTotal"></span></small>
        <nav><ul class="pagination pagination-sm mb-0" id="pagNums"></ul></nav>
    </div>
</div>

<script>
let currentPage = 1;
const STATUS_COLORS = {DRAFT:'secondary',FINAL:'primary',SUBMITTED:'success'};
function getCSRF() { return document.cookie.match(/csrftoken=([^;]+)/)?.[1] || ''; }
function showAlert(msg, type='success') {
    const b=document.getElementById('alertBox'); b.className=`alert alert-${type}`; b.textContent=msg; b.style.display='block';
    setTimeout(()=>b.style.display='none',5000);
}

// Default last month as range
(function(){
    const d = new Date(); d.setDate(1);
    const lastDayPrev = new Date(d.getTime()-1);
    const firstDayPrev = new Date(lastDayPrev.getFullYear(),lastDayPrev.getMonth(),1);
    document.getElementById('gStart').value = firstDayPrev.toISOString().slice(0,10);
    document.getElementById('gEnd').value = lastDayPrev.toISOString().slice(0,10);
})();

function loadData() {
    const rtype = document.getElementById('filterType').value;
    fetch(`{% url 'regulatory:report_api' %}?report_type=${rtype}&page=${currentPage}`)
        .then(r=>r.json()).then(data=>{
            document.getElementById('totalBadge').textContent = data.total + ' reports';
            const tbody = document.getElementById('tableBody');
            if (!data.records.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No reports yet. Pick a period above and click Generate.</td></tr>';
                document.getElementById('pagBar').style.cssText='display:none !important'; return;
            }
            tbody.innerHTML = data.records.map(r => {
                const c = STATUS_COLORS[r.status]||'secondary';
                return `<tr>
                    <td class="text-black"><strong>${r.report_type_label}</strong></td>
                    <td class="text-black small">${r.period_start} → ${r.period_end}</td>
                    <td><span class="badge bg-${c}">${r.status}</span></td>
                    <td class="text-black small">${r.generated_at.slice(0,16).replace('T',' ')}</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-xs btn-outline-secondary py-0 px-1" href="/regulatory/reports/${r.id}/pdf/" target="_blank"><i class="bi bi-file-pdf"></i> PDF</a>
                        <a class="btn btn-xs btn-outline-secondary py-0 px-1" href="/regulatory/reports/${r.id}/xlsx/"><i class="bi bi-file-spreadsheet"></i> Excel</a>
                        <div class="dropdown d-inline-block">
                            <button class="btn btn-xs btn-outline-dark py-0 px-1 dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-check2-square"></i></button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item small" href="#" onclick="event.preventDefault();setStatus(${r.id},'FINAL')">Mark Final</a></li>
                                <li><a class="dropdown-item small" href="#" onclick="event.preventDefault();setStatus(${r.id},'SUBMITTED')">Mark Submitted</a></li>
                                <li><a class="dropdown-item small" href="#" onclick="event.preventDefault();setStatus(${r.id},'DRAFT')">Revert to Draft</a></li>
                            </ul>
                        </div>
                        <button class="btn btn-xs btn-outline-danger py-0 px-1" title="Delete" onclick="deleteEntry(${r.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
            buildPagination(data.page, data.pages, data.total);
        });
}

function buildPagination(page, pages, total) {
    const bar = document.getElementById('pagBar');
    if (pages<=1){bar.style.cssText='display:none !important';return;}
    bar.style.cssText='display:flex !important';
    document.getElementById('pagShowing').textContent=`${(page-1)*25+1}–${Math.min(page*25,total)}`;
    document.getElementById('pagTotal').textContent=total;
    let html=`<li class="page-item ${page<=1?'disabled':''}"><a class="page-link" href="#" onclick="event.preventDefault();goPage(${page-1})">‹</a></li>`;
    for(let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++)
        html+=`<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" onclick="event.preventDefault();goPage(${i})">${i}</a></li>`;
    html+=`<li class="page-item ${page>=pages?'disabled':''}"><a class="page-link" href="#" onclick="event.preventDefault();goPage(${page+1})">›</a></li>`;
    document.getElementById('pagNums').innerHTML=html;
}
function goPage(p){currentPage=p;loadData();}

function generateReport() {
    const params = new URLSearchParams({
        csrfmiddlewaretoken:getCSRF(),
        report_type:document.getElementById('gType').value,
        period_start:document.getElementById('gStart').value,
        period_end:document.getElementById('gEnd').value,
    });
    fetch("{% url 'regulatory:report_generate' %}", {method:'POST',body:params,headers:{'X-CSRFToken':getCSRF()}})
        .then(r=>r.json()).then(d=>{
            if(d.success){
                showAlert((d.message||'Report generation queued.') + ' Redirecting…','info');
                if (d.job_url) setTimeout(()=>window.location=d.job_url, 600);
                else loadData();
            } else showAlert(d.error||'Generation failed','danger');
        });
}

function setStatus(id, status) {
    const params = new URLSearchParams({csrfmiddlewaretoken:getCSRF(), status:status});
    fetch(`/regulatory/reports/${id}/status/`, {method:'POST',body:params,headers:{'X-CSRFToken':getCSRF()}})
        .then(r=>r.json()).then(d=>{
            if(d.success){showAlert('Status: '+d.status);loadData();}
            else showAlert(d.error||'Update failed','danger');
        });
}

function deleteEntry(id) {
    if(!confirm('Delete this report?'))return;
    fetch(`{% url 'regulatory:report_delete' 0 %}`.replace('/0/',`/${id}/`),{method:'POST',headers:{'X-CSRFToken':getCSRF()}})
        .then(r=>r.json()).then(d=>{if(d.success){showAlert('Deleted.');loadData();}});
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
