# =============================================================================
# UMP Mediation System — Nginx Reverse Proxy
# =============================================================================
# Copy to /etc/nginx/sites-available/ump-mediation
# ln -s /etc/nginx/sites-available/ump-mediation /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# =============================================================================

upstream ump_mediation {
    server unix:/opt/ump/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name 192.168.1.5;

    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    client_max_body_size 100M;

    # Static files
    location /static/ {
        alias /opt/ump/mediation/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /opt/ump/mediation/media/;
        expires 7d;
    }

    # Application
    location / {
        proxy_pass http://ump_mediation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
    }
}

